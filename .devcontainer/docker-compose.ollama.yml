# ─────────────────────────────────────────────────────────────────
# Ollama オプション構成
# Ollamaを使いたいときだけ、DevContainerとは別に起動してください。
#
# 起動（PowerShellから）:
#   docker compose -f .devcontainer/docker-compose.ollama.yml up -d
#
# モデルのダウンロード（初回のみ）:
#   docker exec ollama ollama pull qwen3.5:4b
#
# 停止:
#   docker compose -f .devcontainer/docker-compose.ollama.yml down
# ─────────────────────────────────────────────────────────────────
version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-data: